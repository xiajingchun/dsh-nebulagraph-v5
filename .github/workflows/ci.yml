name: ci

# Typecheck, bundle smoke-check, and test on every push to main and every PR.
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Uses the `packageManager` field (pnpm@11.7.0) in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # `prepare` (pnpm build) is skipped: typecheck and tests read src/
      # directly, and the bundle check below builds the client explicitly.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck (host)
        run: pnpm typecheck

      # esbuild bundling of the Web Client — catches resolution/entry
      # regressions that typecheck does not. Note: `typecheck:client` is NOT
      # run in CI because tsconfig.client.json pins machine-local `paths` into
      # a harness checkout; esbuild resolves the same imports through pnpm's
      # virtual store, so the bundle check covers the real build path.
      - name: Client bundle smoke check
        run: pnpm build:client

      - name: Run tests
        run: pnpm test
